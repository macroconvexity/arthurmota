<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MTG Classic+</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="css/style.css?v=20261102202011">
<link rel="stylesheet" href="css/menu.css?v=20261102202011">
<link rel="stylesheet" href="css/anim_zones.css?v=20261102202011">
<link rel="stylesheet" href="css/anim_status.css?v=20261102202011">
<link rel="stylesheet" href="css/anim_ambient.css?v=20261102202011">
<link rel="stylesheet" href="css/plates.css?v=20261102202011">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MTG Classic+">
<meta name="theme-color" content="#0e0907"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div id="app">
  <header id="nav">
    <div class="logo"><span class="mtg">MAGIC</span><small>The Gathering</small><i></i><b>CLASSIC<em>+</em></b></div>
    <nav id="tabs">
      <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>Home</button>
      <button data-v="decks"><svg viewBox="0 0 24 24"><path d="M4 4h7a2 2 0 012 2v14a2 2 0 00-2-2H4zM20 4h-7a2 2 0 00-2 2v14a2 2 0 012-2h7z"/></svg>Decks</button>
      <button data-v="collection"><svg viewBox="0 0 24 24"><path d="M7 3h10l2 3v15H5V6zM9 8h6"/></svg>Collection</button>
      <button data-v="ach" disabled><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="6"/><path d="M8 16l-2 5 6-3 6 3-2-5"/></svg>Achievements</button>
    </nav>
  </header>
  <main id="views">
    <section id="v-home"></section>
    <section id="v-collection"></section>
    <section id="v-decks"></section>
  </main>
</div>
<div id="board" hidden>
<div id="stage">
  <div id="opp-hand" class="hand-back"></div>
  <div id="zones-opp" class="zones"></div>
  <div id="field-opp-lands" class="row lands"></div>
  <div id="field-opp" class="row creatures"></div>
  <div id="field-me" class="row creatures"></div>
  <div id="field-me-lands" class="row lands"></div>
  <div id="field-opp-misc" class="misc"></div>
  <div id="field-me-misc" class="misc"></div>
  <div id="zones-me" class="zones"></div>
  <div id="life-1" class="life"><div class="who"></div><div class="num"></div></div>
  <div id="life-0" class="life"><div class="who"></div><div class="num"></div></div>
  <div id="phases"></div>
  <div id="turnno"></div>
  <div id="banner"></div>
  <div id="stack"></div>
  <div id="hand"></div>
  <div id="action"><button id="act-btn"></button><button id="act-alt" hidden></button><button id="act-undo" hidden>Undo land</button></div>
  <button id="concede">Leave</button>
  <button id="logbtn" aria-label="Game log" title="Game log">&#9776;</button>
  <button id="mute" aria-label="Sound" title="Mute"><svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9z"/><path class="w" fill="none" stroke="currentColor" stroke-width="2" d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg></button>
  <button id="emote" aria-label="Emote" title="Emote">&#9786;</button>
  <div id="emotemenu"><button>Good game</button><button>Thinking...</button><button>Nice!</button><button>Oops</button><button>Well played</button></div>
  <button id="help" aria-label="How to play" title="How to play">?</button>
  <div id="logdrawer"><div class="lh"><b>Game log</b><button class="lx">&times;</button></div><div class="ll"></div></div>
  <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.5 7.5 0 00-1.7-1L15 3.5h-4l-.4 2.5a7.5 7.5 0 00-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1l.4 2.5h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg></button>
  <div id="hint"></div>
  <div id="dropzone"></div>
  <div id="log"></div>
</div>
  <div id="preview"></div>
  <div id="inspect" hidden></div>
  <div id="over" hidden></div>
  <div id="rotate"><div class="rbox"><svg viewBox="0 0 48 48" width="64" height="64"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M40 24a16 16 0 0 0-8-13.8M8 24a16 16 0 0 0 8 13.8" fill="none" stroke="currentColor" stroke-width="2.5"/></svg><p>Rotate your device</p><small>The board is built for landscape.</small><button id="rotate-go">Play anyway</button></div></div>
</div>
<script type="module" src="js/ui.js?v=20261102202011"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));window.BUILD='20261102202011';</script>
</body>
</html>
