<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Arthur Mota</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#f5f2ea">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">
        <span>Arthur Mota</span>
        <small>Macro · Markets · Research</small>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="{{ '/research.html' | relative_url }}">Research</a>
        <a href="{{ '/discussion.html' | relative_url }}">Notes</a>
        <a href="{{ '/dashboard.html' | relative_url }}">Research Lab</a>
        <a href="{{ '/book.html' | relative_url }}">Books</a>
        <a href="{{ '/lectures.html' | relative_url }}">Lectures</a>
        <a href="{{ '/cv.html' | relative_url }}">CV</a>
      </nav>
    </div>
  </header>

  <main class="shell page-shell">
    {% if page.prose %}<div class="prose">{% endif %}
    {{ content }}
    {% if page.prose %}</div>{% endif %}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Arthur Mota</span>
      <span>Miami, Florida</span>
    </div>
  </footer>
</body>
</html>
