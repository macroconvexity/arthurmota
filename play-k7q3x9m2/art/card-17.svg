<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="card-art">
  <!-- Target Pawn in center -->
  <circle cx="50" cy="44" r="8" fill="currentColor"/>
  <path d="M42 54 C42 49 58 49 58 54 C58 60 62 66 64 72 H36 C38 66 42 60 42 54 Z" fill="currentColor"/>
  <rect x="32" y="72" width="36" height="5" rx="1.5" fill="currentColor"/>
  <!-- Crosshair Circles -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="var(--gc, #e9b44c)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="var(--gc, #e9b44c)" stroke-width="1.8" stroke-dasharray="5 3"/>
  <!-- Crosshair Lines with Tick Gaps -->
  <line x1="50" y1="10" x2="50" y2="30" stroke="var(--gc, #e9b44c)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="50" y2="90" stroke="var(--gc, #e9b44c)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="50" x2="30" y2="50" stroke="var(--gc, #e9b44c)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="50" x2="90" y2="50" stroke="var(--gc, #e9b44c)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Red dot center -->
  <circle cx="50" cy="50" r="3" fill="var(--gc, #e9b44c)"/>
</svg>
