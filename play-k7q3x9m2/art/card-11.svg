<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="card-art">
  <!-- Outer Square Perimeter -->
  <rect x="18" y="18" width="64" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <!-- Brick Courses -->
  <rect x="22" y="24" width="26" height="14" fill="currentColor"/>
  <rect x="52" y="24" width="26" height="14" fill="currentColor"/>
  <rect x="22" y="42" width="16" height="14" fill="currentColor"/>
  <rect x="42" y="42" width="26" height="14" fill="currentColor"/>
  <rect x="72" y="42" width="6" height="14" fill="currentColor"/>
  <rect x="22" y="60" width="26" height="16" fill="currentColor"/>
  <rect x="52" y="60" width="26" height="16" fill="currentColor"/>
  <!-- Golden mortar / reinforcement lines -->
  <line x1="20" y1="40" x2="80" y2="40" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <line x1="20" y1="58" x2="80" y2="58" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <line x1="50" y1="24" x2="50" y2="38" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <line x1="40" y1="42" x2="40" y2="56" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <line x1="70" y1="42" x2="70" y2="56" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="76" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
</svg>
