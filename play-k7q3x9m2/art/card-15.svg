<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="card-art">
  <!-- Tumbling Card (angled) -->
  <g transform="rotate(16 46 44)">
    <rect x="28" y="20" width="36" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <rect x="34" y="26" width="24" height="36" rx="2" fill="currentColor" opacity="0.12"/>
    <line x1="38" y1="38" x2="54" y2="38" stroke="currentColor" stroke-width="2"/>
    <line x1="42" y1="46" x2="50" y2="46" stroke="currentColor" stroke-width="2"/>
  </g>
  <!-- Discard Void Portal / Swirl -->
  <ellipse cx="50" cy="84" rx="34" ry="8" fill="none" stroke="var(--gc, #e9b44c)" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="50" cy="84" rx="22" ry="5" fill="none" stroke="var(--gc, #e9b44c)" stroke-width="2"/>
  <!-- Falling fragments -->
  <polygon points="26,62 34,60 30,70" fill="var(--gc, #e9b44c)"/>
  <polygon points="68,58 76,64 70,72" fill="var(--gc, #e9b44c)"/>
  <polygon points="56,70 64,68 62,76" fill="var(--gc, #e9b44c)"/>
  <!-- Downward motion streaks -->
  <line x1="42" y1="64" x2="42" y2="76" stroke="var(--gc, #e9b44c)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="50" y1="66" x2="50" y2="80" stroke="var(--gc, #e9b44c)" stroke-width="2" stroke-linecap="round"/>
</svg>
